<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!--
      El <title>, el `lang` de arriba y las etiquetas Open Graph los inyecta el
      plugin `metadatos-del-evento` de vite.config.ts leyendo src/config/meta.ts.
      No las escribas aquí a mano o habrá dos fuentes de verdad.
    -->

    <!--
      Las tipografías se sirven desde este mismo dominio (ver
      src/styles/fuentes.css). Aquí solo se precargan las tres que necesita la
      PRIMERA pantalla: el saludo de la bienvenida y sus dos botones.

      Sin esto el navegador no sabe que las necesita hasta que descarga y
      parsea el CSS, así que el texto se pinta con la tipografía del sistema y
      salta al cambiar. Las demás (Parisienne, la redonda de Cormorant y el
      peso medio de Jost) se descargan solas cuando aparece el texto que las
      usa: precargarlas aquí solo robaría ancho de banda a estas tres.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/cormorant-garamond-300.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/jost-300.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/jost-400.woff2" />
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      Esta invitación necesita JavaScript activado para mostrarse. Si no puedes activarlo,
      escríbenos por WhatsApp y te contamos todos los detalles.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
