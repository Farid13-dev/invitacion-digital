<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!--
      El <title>, el `lang` de arriba y las etiquetas Open Graph los inyecta el
      plugin `metadatos-del-evento` de vite.config.ts leyendo src/config/meta.ts.
      No las escribas aquí a mano o habrá dos fuentes de verdad.
    -->

    <!--
      Las tipografías se sirven desde este mismo dominio (ver
      src/styles/fuentes.css) y se precargan las tres porque las tres salen en
      la PRIMERA pantalla: Overlock en el saludo y los nombres, Quicksand en
      la nota y los botones. Sin esto el navegador no sabe que las necesita
      hasta parsear el CSS, y el texto salta al cambiar de tipografía.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/overlock-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/overlock-700.woff2" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/quicksand-variable.woff2"
    />
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      Esta invitación necesita JavaScript activado para mostrarse. Si no puedes activarlo,
      escríbenos por WhatsApp y te contamos todos los detalles.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
